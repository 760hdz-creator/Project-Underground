// Project Underground for Android (arm64-v8a). tools/build_android.sh copies SDL's android-project, puts this folder
// over it and the native libraries in app/libs/arm64-v8a; Gradle builds no native code.
plugins {
    id 'com.android.application'
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.eightgramlabs.underground"
        minSdkVersion 33
        targetSdkVersion 35
        versionCode Integer.parseInt(project.findProperty('ugVersionCode') ?: '1')
        versionName project.findProperty('ugVersionName') ?: '0.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = false }
    }
    lint {
        abortOnError = false
    }
}
